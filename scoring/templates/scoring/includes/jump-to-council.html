<form class="d-lg-flex flex-row justify-content-between gap-5">
    <div class="d-flex flex-row align-items-center gap-2">
        <label class="fs-7" for="location-jump">Find a council:</label>
        <input id="location-jump" class="form-control searchbar js-location-jump-autocomplete" type="search" placeholder="Council name" aria-label="Council name">
    </div>
    {% if previous_year %}
    <div class="d-none d-lg-flex flex-row gap-5 align-items-center">
        <div id="versus-year-dropdown--desktop" class="d-flex flex-row align-items-center gap-2">
            <label class="fs-7 mb-0 text-nowrap" for="js-comparison-year-select"><span class="badge bg-warning rounded-pill me-2">New</span>Versus:</label>
            <select id="js-comparison-year-select" class="form-select border border-primary bg-primary-100 form-select-sm w-auto" aria-label="Comparison year">
                <option value="2025" selected>Action Scorecards 2025</option>
                <option value="2023">Action Scorecards 2023</option>
                <option value="hide-point-percentage">Hide percentage point change</option>
            </select>
        </div>

        <div class="d-none d-md-flex flex-row gap-3">
            <h4 class="visually-hidden">Legends for difference column</h4>
            <div class="fs-8">
                <span class="badge bg-gray-300 text-dark border border-dark border-opacity-25">--</span> No change
            </div>
            <div class="fs-8">
                <span class="badge bg-gray-300 text-dark border border-dark border-opacity-25">NA</span> New council
            </div>
        </div>
    </div>
    {% endif %}
</form>

<script>
// [Scorecards 2027 mockup] Switch the versus-comparison year (issue #823).
// Throwaway front-end mock — real 2023 deltas get wired in by the developer.
(function () {
    function init() {
        var select = document.getElementById('js-comparison-year-select');
        if (!select) { return; }

        var diffCells = document.querySelectorAll('.js-previous-year-score-difference');

        function readDelta(cell) {
            var text = cell.textContent.trim();
            if (text.indexOf('NA') !== -1) { return null; }
            if (text.indexOf('--') !== -1) { return 0; }
            var n = parseInt(text.replace(/[^\-0-9]/g, ''), 10);
            return isNaN(n) ? null : n;
        }

        function renderDelta(cell, value) {
            cell.classList.remove('text-success', 'text-warning');
            if (value === null) {
                cell.innerHTML = '<span class="fs-8">NA</span>';
            } else if (value > 0) {
                cell.classList.add('text-success');
                cell.innerHTML = '<span class="fs-8">&#9650;</span> ' + value;
            } else if (value < 0) {
                cell.classList.add('text-warning');
                cell.innerHTML = '<span class="fs-8">&#9660;</span> ' + value;
            } else {
                cell.innerHTML = '<span class="fs-8">--</span>';
            }
        }

        // Cache the real (versus 2025) delta and invent a versus-2023 one once,
        // so toggling back and forth stays stable.
        Array.prototype.forEach.call(diffCells, function (cell) {
            var vs2025 = readDelta(cell);
            cell.dataset.vs2025 = (vs2025 === null) ? 'NA' : vs2025;
            // 2023 is further back, so show a bigger jump.
            cell.dataset.vs2023 = (vs2025 === null) ? 'NA' : (vs2025 + Math.floor(Math.random() * 10) + 3);
        });

        function setYear(year) {
            Array.prototype.forEach.call(diffCells, function (cell) {
                var stored = cell.dataset['vs' + year];
                renderDelta(cell, stored === 'NA' ? null : parseInt(stored, 10));
            });
            var headers = document.querySelectorAll('.scorecard-table__year-difference-column button');
            Array.prototype.forEach.call(headers, function (button) {
                Array.prototype.forEach.call(button.childNodes, function (node) {
                    if (node.nodeType === 3 && /versus\s*20\d{2}/.test(node.nodeValue)) {
                        node.nodeValue = node.nodeValue.replace(/versus\s*20\d{2}/, 'versus ' + year);
                    }
                });
            });
        }

        select.addEventListener('change', function () {
            showOrHideYearDifference();
            if (select.value !== 'hide-point-percentage') {
                setYear(select.value);
            }
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
